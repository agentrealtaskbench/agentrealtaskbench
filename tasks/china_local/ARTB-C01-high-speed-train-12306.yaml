    - All listed trains exist, arrive before 18:00, prices match 12306; none of the 3 earliest qualifying trains is missed.
    zh:
    - 列出的车次都存在、18 点前到达、票价与 12306 一致；最早的 3 个符合条件的车次没有遗漏。
  partial:
    en:
    - Trains real, but a price is wrong or a qualifying early train is missed.
    zh:
    - 车次真实，但有票价错误，或者漏了靠前的符合条件车次。
  fail:
