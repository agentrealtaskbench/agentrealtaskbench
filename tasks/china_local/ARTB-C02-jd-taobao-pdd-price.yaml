id: ARTB-C02
slug: jd-taobao-pdd-price
task_version: '1.0'
board: china_local
category: shopping
dimensions:
- china_local
- purchasing
- data_access
safety: false
title:
  en: JD vs Taobao vs Pinduoduo
  zh: 京东、淘宝、拼多多比价
scenario:
  en: Which store is cheapest for the exact same item, after coupons?
  zh: 同一件商品，算上券哪家最便宜？
prompt:
  en: Compare the price of {product} on JD, Taobao and Pinduoduo right now, after coupons. Give links.
  zh: 比较 {product} 现在在京东、淘宝、拼多多算上券的到手价，附链接。
params:
- name: product
  description: A specific SKU, e.g. a model number
setup:
- Tester records the three prices from a logged-in test account within 15 minutes.
limits:
  time_limit_min: 30
  neutral_follow_ups: 1
criteria:
  pass:
    en:
    - All 3 prices within 5% of the baseline, same SKU, working links, correct cheapest store.
    zh:
    - 3 个价格都与基准相差不超过 5%，是同一型号，链接能打开，最便宜的店判断正确。
  partial:
    en:
    - 2 of 3 prices correct.
    zh:
    - 3 个价格里有 2 个正确。
  fail:
    en:
    - 1 or fewer correct, or an invented price.
    zh:
    - 正确的不超过 1 个，或者编造价格。
evidence:
- screen_recording
- baseline_screenshots
