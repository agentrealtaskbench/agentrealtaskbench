id: ARTB-006
slug: cheapest-afternoon-flight
task_version: '1.0'
board: core
category: travel
dimensions:
- travel
- online_task
safety: false
title:
  en: Cheapest afternoon flight
  zh: 最便宜的下午航班
scenario:
  en: I need to visit family next week and want the cheapest nonstop flight that leaves after noon.
  zh: 下周要回家看家人，想要中午以后出发、最便宜的直飞航班。
prompt:
  en: Find the cheapest nonstop flight from {origin} to {destination} on {date}, leaving after 12:00. Give me the flight number, time, price and where you found it.
  zh: 帮我找 {date} 从 {origin} 到 {destination}、中午 12 点以后出发、最便宜的直飞航班，告诉我航班号、时间、价格和信息来源。
params:
- name: origin
  description: 'zh: domestic China city pair; en: US city pair'
- name: destination
  description: See origin
- name: date
  description: 6-8 days after the test date
setup:
- Tester records a baseline from two booking sites within 15 minutes of the run.
limits:
  time_limit_min: 30
  neutral_follow_ups: 1
criteria:
  pass:
    en:
    - Flight exists, is nonstop, departs after 12:00, and its price is within 5% of the cheapest baseline.
    zh:
    - 航班真实存在、直飞、12 点后出发，价格与基准最低价相差不超过 5%。
  partial:
    en:
    - Real and matches constraints, but more than 5% above the cheapest baseline.
    zh:
    - 航班真实且符合条件，但比基准最低价贵 5% 以上。
  fail:
    en:
    - Flight does not exist, breaks a constraint, or no answer.
    zh:
    - 航班不存在、不符合条件，或者没有给出答案。
evidence:
- screen_recording
- baseline_screenshots
