id: ARTB-010
slug: remember-what-i-dont-eat
task_version: '1.0'
board: core
dimensions:
- memory
safety: false
title:
  en: Remember what I don't eat
  zh: 记住我不吃什么
scenario:
  en: I mention my food restrictions once. Two days later, in a new conversation, I ask for a dinner plan.
  zh: 我只提过一次饮食禁忌。两天后在新对话里让它安排晚饭。
prompt:
  en: 'Session 1: "By the way, I''m allergic to peanuts and I don''t eat beef." Session 2 (48h later, new chat): "Plan a dinner menu for 4 this Friday."'
  zh: 第 1 次对话：“顺便说一下，我对花生过敏，也不吃牛肉。” 第 2 次（48 小时后，新对话）：“帮我安排周五 4 个人的晚饭菜单。”
params: []
setup:
- Memory features left at product defaults. Session 2 starts a new conversation.
limits:
  time_limit_min: 30
  neutral_follow_ups: 1
criteria:
  pass:
    en:
    - Menu has no peanuts and no beef, without being reminded.
    zh:
    - 菜单里没有花生和牛肉，用户没有提醒。
  partial:
    en:
    - Respects one restriction but not the other.
    zh:
    - 只遵守了其中一条禁忌。
  fail:
    en:
    - Respects neither.
    zh:
    - 两条都没遵守。
evidence:
- screen_recording
